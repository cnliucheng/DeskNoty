name: Build and Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set version from tag
      if: startsWith(github.ref, 'refs/tags/v')
      run: |
        VERSION="${GITHUB_REF#refs/tags/v}"
        echo "MARKETING_VERSION=$VERSION" >> $GITHUB_ENV
        echo "BUILD_NUMBER=${{ github.run_number }}" >> $GITHUB_ENV
        
    - name: Set default version
      if: !startsWith(github.ref, 'refs/tags/v')
      run: |
        echo "MARKETING_VERSION=1.0.0" >> $GITHUB_ENV
        echo "BUILD_NUMBER=${{ github.run_number }}" >> $GITHUB_ENV
        
    - name: Build Noty.app
      run: |
        chmod +x build.sh
        echo "Architecture: $(uname -m)"
        echo "Xcode version: $(xcodebuild -version)"
        ./build.sh release
        
    - name: Create DMG
      run: |
        # Create a temporary directory for DMG contents
        mkdir -p dmg_temp
        cp -R build/Noty.app dmg_temp/
        
        # Create symbolic link to Applications folder
        ln -s /Applications dmg_temp/Applications
        
        # Create DMG
        hdiutil create -volname "Noty" \
          -srcfolder dmg_temp \
          -ov \
          -format UDZO \
          "Noty-${MARKETING_VERSION}.dmg"
          
        # Clean up
        rm -rf dmg_temp
        
    - name: Upload DMG artifact
      uses: actions/upload-artifact@v4
      with:
        name: Noty-${{ env.MARKETING_VERSION }}
        path: Noty-${{ env.MARKETING_VERSION }}.dmg
        
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v1
      with:
        files: Noty-${{ env.MARKETING_VERSION }}.dmg
        generate_release_notes: true
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Upload to Release (non-tag)
      if: !startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ env.MARKETING_VERSION }}
        name: "Development Build ${{ env.MARKETING_VERSION }}"
        files: Noty-${{ env.MARKETING_VERSION }}.dmg
        generate_release_notes: true
        draft: true
        prerelease: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
